name: Deploy Wentu to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify static entry points
        run: |
          test -s pages/index.html
          test -s pages/styles.css
          test -s pages/app.js
          node --check pages/app.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment